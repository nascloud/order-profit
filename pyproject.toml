[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "order-profit"
dynamic = ["version"]
description = "可追溯的电商订单利润核算与报表程序"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "tzdata>=2025.2",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.22,<7"]
dev = [
  "playwright>=1.50,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]
windows-excel = ["pywin32>=308; platform_system == 'Windows'"]

[project.scripts]
order-profit = "order_profit.__main__:main"
order-profit-gui = "order_profit.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/order_profit"]

[tool.hatch.version]
path = "src/order_profit/__init__.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
